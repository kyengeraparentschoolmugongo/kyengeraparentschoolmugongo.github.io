name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Word/PowerPoint/Excel -> PDF so every document gets thumbnails,
      # the flipbook and vertical reading. Originals stay downloadable.
      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress libreoffice-calc fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation

      - name: Convert documents to PDF
        run: python3 scripts/convert-documents.py

      - name: Save converted PDFs to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public src/data/converted-documents.json
          git diff --cached --quiet || (git commit -m "Convert documents to PDF [skip ci]" && git push)

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        shell: bash
        run: |
          set -o pipefail
          if bun run build 2>&1 | tee "$RUNNER_TEMP/static-build.log"; then
            exit 0
          else
            build_status=$?
          fi
          {
            echo '## Static site build failed'
            echo 'The final build output is below. Copy this section when requesting a fix.'
            echo '```text'
            tail -100 "$RUNNER_TEMP/static-build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Expose the actual error in the public run annotations, not just exit code 1.
          details=$(tail -60 "$RUNNER_TEMP/static-build.log")
          details="${details//'%'/'%25'}"
          details="${details//$'\r'/'%0D'}"
          details="${details//$'\n'/'%0A'}"
          echo "::error title=Static site build error::$details"
          exit "$build_status"

      - name: Save build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static-build-log
          path: ${{ runner.temp }}/static-build.log
          if-no-files-found: ignore

      - name: Prepare static output
        run: |
          # SPA fallback: GitHub Pages serves 404.html for unknown paths
          # (e.g. /doc/<slug> deep links); the React router takes over.
          cp dist/client/index.html dist/client/404.html
          # Skip Jekyll processing so all files deploy as-is.
          touch dist/client/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
